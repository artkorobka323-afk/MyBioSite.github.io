<style>
    body {
        cursor: url(img/extralsmall.png);
    }
    /* Basic animation */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      opacity: 0;
    }
    
    /* Delay classes */
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    /* ... other delay classes ... */
    
    /* Group elements for section animations */
    .animation-group {
      margin-bottom: 40px;
    }

    * {
    cursor: url('Aero.cur'), auto !important;
}

/* For buttons and links */
a, button, .linkedAccountsRedirect svg, .popup-button {
    cursor: url('Aero.cur'), pointer !important;
}

        /* Force layout recalculation on page load */
        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Media query debugging */
        @media screen and (max-width: 768px) {
            /* Ensure responsive elements are flexible */
            * {
                max-width: 100%;
                box-sizing: border-box;
            }
        }

        /* Кнопка комментариев временно отключена */
        .commentsPageButton.disabled {
            display: none !important;
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(70%);
        }

        /* Увеличенные иконки Steam и Telegram */
       .linkedAccountsRedirect img {
    display: block;
    transition: transform 0.2s ease;
}

        .linkedAccountsRedirect img:hover {
            transform: scale(1.15);
        }
  </style>

    <script>
    // Плейлист берётся из папки /music.
    // ВАЖНО: замените названия файлов ниже на реальные имена ваших треков из папки /music
    document.addEventListener('DOMContentLoaded', function () {
        const playlist = [
            'music/track1.mp3',
            'music/track2.mp3',
            'music/track3.mp3'
        ];
        let currentTrackIndex = 0;

        const audio = document.querySelector('.audioPlayer');
        const prevBtnOld = document.querySelector('.player-controls .prev');
        const nextBtnOld = document.querySelector('.player-controls .next');
        const totalTimeEl = document.querySelector('.total-time');
        const currentTimeEl = document.querySelector('.current-time');
        const timelineProgress = document.querySelector('.timeline-progress');

        if (!audio || !prevBtnOld || !nextBtnOld) return;

        // Клонируем кнопки prev/next, чтобы удалить старые обработчики
        // (которые перематывали трек на 5 секунд) и повесить новые —
        // переключение треков.
        const prevBtn = prevBtnOld.cloneNode(true);
        const nextBtn = nextBtnOld.cloneNode(true);
        prevBtnOld.parentNode.replaceChild(prevBtn, prevBtnOld);
        nextBtnOld.parentNode.replaceChild(nextBtn, nextBtnOld);

        function formatTime(sec) {
            if (!isFinite(sec) || sec < 0) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function loadTrack(index, autoplay) {
            currentTrackIndex = (index + playlist.length) % playlist.length;
            const shouldPlay = autoplay !== undefined ? autoplay : !audio.paused;
            audio.src = playlist[currentTrackIndex];
            audio.load();
            if (shouldPlay) {
                audio.play().catch(() => {});
            }
        }

        audio.addEventListener('loadedmetadata', function () {
            if (totalTimeEl) totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', function () {
            if (currentTimeEl) currentTimeEl.textContent = formatTime(audio.currentTime);
            if (timelineProgress && audio.duration) {
                timelineProgress.style.width = (audio.currentTime / audio.duration * 100) + '%';
            }
        });

        audio.addEventListener('ended', function () {
            loadTrack(currentTrackIndex + 1, true);
        });

        prevBtn.addEventListener('click', function () {
            loadTrack(currentTrackIndex - 1);
        });

        nextBtn.addEventListener('click', function () {
            loadTrack(currentTrackIndex + 1);
        });
    });
    </script>

    <script>
// Container animation code
const container = document.getElementById('container');

// Initial settings with optimized properties
container.style.boxShadow = '0 10px 20px rgba(0,0,0,0.1)';
container.style.zIndex = '1';
container.style.position = 'relative';
container.style.willChange = 'transform';
container.style.backfaceVisibility = 'hidden';
container.style.transformStyle = 'preserve-3d';

// Variables for smooth animation
let currentX = 0;
let currentY = 0;
let targetX = 0;
let targetY = 0;
let rafId = null;

// Animation function with requestAnimationFrame
function animateTransform() {
    // Smooth interpolation between current and target position
    currentX += (targetX - currentX) * 0.1;
    currentY += (targetY - currentY) * 0.1;
    
    // Apply transformation
    container.style.transform = `
        perspective(1000px)
        rotateX(${currentY}deg)
        rotateY(${currentX}deg)
    `;
    
    // Continue animation only if there's significant movement
    if (Math.abs(targetX - currentX) > 0.01 || Math.abs(targetY - currentY) > 0.01) {
        rafId = requestAnimationFrame(animateTransform);
    } else {
        rafId = null;
    }
}

// Mouse movement effect inside container
container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const offsetX = (x - centerX) / centerX;
    const offsetY = (y - centerY) / centerY;
    const intensity = 15;
    
    // Update target values
    targetX = offsetX * intensity;
    targetY = offsetY * intensity;
    
    // Start animation if not running
    if (!rafId) {
        rafId = requestAnimationFrame(animateTransform);
    }
    
    // Prevent event propagation
    e.stopPropagation();
});

// When mouse leaves the container
container.addEventListener('mouseleave', () => {
    // Set target to initial position
    targetX = 0;
    targetY = 0;
    
    // Start return animation if not running
    if (!rafId) {
        rafId = requestAnimationFrame(animateTransform);
    }
});

// Prevent sparkle creation inside container
container.addEventListener('mouseenter', (e) => {
    e.stopPropagation();
});
</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const popup = document.getElementById('redirect-popup');
        const popupCancel = document.getElementById('popup-cancel');
        const popupConfirm = document.getElementById('popup-confirm');
        const popupMessage = document.getElementById('popup-message');
        
        let currentLink = '';
        let currentPlatform = '';
        
        // Add click event to links with id trigger-popup
        document.querySelectorAll('a#trigger-popup').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                
                currentLink = this.getAttribute('href');
                currentPlatform = this.getAttribute('data-type');
                
                // Configure popup message
                popupMessage.textContent = `You will be redirected to ${currentPlatform}. Do you want to continue?`;
                
                // Show popup
                popup.classList.add('active');
            });
        });
        
        // Cancel button
        popupCancel.addEventListener('click', function() {
            popup.classList.remove('active');
        });
        
        // Confirm button
        popupConfirm.addEventListener('click', function() {
            window.open(currentLink, '_blank');
            popup.classList.remove('active');
        });
        
        // Close popup when clicking outside
        popup.addEventListener('click', function(e) {
            if (e.target === popup) {
                popup.classList.remove('active');
            }
        });
    });
</script>

  <script>
    // Background rain audio script
document.addEventListener('DOMContentLoaded', function() {
    // Select specifically the rain audio, not the music player
    const rainAudio = document.querySelector('audio[src="img/praiafake.mp3"]');
    
    if (!rainAudio) {
        console.error('Rain audio element not found');
        return;
    }
    
    // Configure rain audio
    rainAudio.loop = true;
    rainAudio.volume = 0.05; // Low volume for ambient sound
    
    // Variable to control if we've already tried to start the audio
    let audioStartAttempted = false;
    
    // Function to try to start the rain audio
    function tryPlayRainAudio() {
        if (audioStartAttempted) return;
        audioStartAttempted = true;
        
        const playPromise = rainAudio.play();
        
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.log('Rain audio autoplay blocked. Waiting for interaction:', error);
                
                // Create a one-time event function to start the audio
                const startRainAudio = function() {
                    rainAudio.play().catch(err => {
                        console.log('Still unable to start rain audio:', err);
                    });
                    
                    // Remove listeners after first attempt
                    document.removeEventListener('click', startRainAudio);
                    document.removeEventListener('touchstart', startRainAudio);
                    document.removeEventListener('keydown', startRainAudio);
                };
                
                // Add events for different interaction types
                document.addEventListener('click', startRainAudio, { once: true });
                document.addEventListener('touchstart', startRainAudio, { once: true });
                document.addEventListener('keydown', startRainAudio, { once: true });
            });
        }
    }
    
    // Try to start audio immediately
    tryPlayRainAudio();
    
    // Backup: try again after 1 second
    setTimeout(tryPlayRainAudio, 1000);
});
  </script>
